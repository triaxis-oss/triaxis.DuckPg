name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # The tests carry their own DuckDB, so nothing has to be installed here.
      - run: dotnet test -c Release --logger "console;verbosity=normal"

      # A tag names the version; anything else packs the version in the project.
      - name: pack
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            dotnet pack -c Release -o artifacts -p:Version="${GITHUB_REF_NAME#v}"
          else
            dotnet pack -c Release -o artifacts
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: artifacts/*.nupkg

      - name: publish
        if: startsWith(github.ref, 'refs/tags/v')
        run: dotnet nuget push 'artifacts/*.nupkg' -s https://api.nuget.org/v3/index.json -k '${{ secrets.NUGET_API_KEY }}'
